[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoprobe"
version = "0.1.1"
description = "Summarize the architecture of any GitHub repo from your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manaswi Chowdary Makkena" }]
keywords = ["github", "cli", "llm", "ast", "code-analysis"]
dependencies = ["httpx>=0.27", "rich>=13", "openai>=1.40"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
repo-scanner = "repo_scanner.cli:main"

[project.urls]
Source = "https://github.com/manaswichowdary/repo-scanner"

[tool.setuptools.packages.find]
include = ["repo_scanner*"]

[tool.setuptools.package-data]
repo_scanner = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
