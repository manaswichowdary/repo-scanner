<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repo Scanner</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6b66; --line:#dcdcd4; --accent:#0b5fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --fg:#ecece6; --muted:#9a9a92; --line:#2e2e2b; --accent:#6ea0ff; }
  }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.55 Georgia, "Times New Roman", serif; }
  main { max-width:680px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:28px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1 1 320px; padding:10px 12px; font:inherit; background:transparent;
          color:inherit; border:1px solid var(--line); border-radius:4px; }
  button { padding:10px 18px; font:inherit; background:var(--accent); color:#fff;
           border:0; border-radius:4px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #out { margin-top:28px; }
  h2 { font-size:15px; margin:20px 0 6px; }
  ul { margin:0; padding-left:20px; }
  .err { color:#b3261e; }
  .meta { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Repo Scanner</h1>
  <p class="sub">Paste a public GitHub repo and get a short architecture summary.</p>
  <form id="f">
    <input id="url" type="text" placeholder="https://github.com/pallets/flask" required
           aria-label="GitHub repo URL">
    <button id="go" type="submit">Analyze</button>
  </form>
  <div id="out" aria-live="polite"></div>
</main>
<script>
const out = document.getElementById("out");
const btn = document.getElementById("go");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list = a => "<ul>" + a.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  btn.disabled = true; out.textContent = "Analyzing...";
  try {
    const r = await fetch("/analyze", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({repo_url: document.getElementById("url").value})});
    const d = await r.json();
    if (!r.ok) { out.innerHTML = '<p class="err">' + esc(d.detail || "Something went wrong.") + "</p>"; return; }
    out.innerHTML = "<h2>" + esc(d.repo) + "</h2><p>" + esc(d.summary) + "</p>" +
      "<h2>Technologies</h2>" + list(d.technologies) +
      "<h2>Architecture</h2>" + list(d.architecture) +
      "<h2>Intended users</h2>" + list(d.intended_users) +
      "<h2>Code quality</h2><p>" + esc(d.code_quality) + "</p>" +
      '<p class="meta">' + d.stats.files_read + " files read, " + d.stats.seconds + " s" +
      (d.cached ? " (cached)" : "") + "</p>";
  } catch (err) { out.innerHTML = '<p class="err">Could not reach the server.</p>'; }
  finally { btn.disabled = false; }
});
</script>
</body>
</html>
